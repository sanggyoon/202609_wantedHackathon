services:
  frontend:
    build: ./frontend
    image: ghcr.io/sanggyoon/wanted-frontend:${IMAGE_TAG:-latest}
    environment:
      - VIRTUAL_HOST=${VIRTUAL_HOST}
      - LETSENCRYPT_HOST=${LETSENCRYPT_HOST}
    restart: always
    networks:
      - proxy

  backend:
    build: ./backend
    image: ghcr.io/sanggyoon/wanted-backend:${IMAGE_TAG:-latest}
    environment:
      - VIRTUAL_HOST=${VIRTUAL_HOST}
      - VIRTUAL_PATH=/api/
      - LETSENCRYPT_HOST=${LETSENCRYPT_HOST}
    restart: always
    networks:
      - proxy

networks:
  proxy:
    external: true
    name: proxy
