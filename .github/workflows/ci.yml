name: CI

on:
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run python -c "import app.main"

      # tests/에 __init__.py가 없어 tests를 top-level로 두고 PYTHONPATH에 함께 넣는다.
      # DATABASE_URL 없이 도는 것이 정상이다 — DB 접근은 저장소 계층을 목으로 막는다.
      - run: uv run python -m unittest discover -s tests -t tests -p 'test_*.py'
        env:
          PYTHONPATH: .:tests
