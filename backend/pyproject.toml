[project]
name = "mediation-backend"
version = "0.1.0"
description = "문철빵 갈등 중재 백엔드"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic-settings>=2.7",
]

[dependency-groups]
dev = [
    "ruff>=0.9",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
